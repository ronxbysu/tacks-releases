<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tacks releases</title>
<meta name="description" content="Current release status of Tacks, a first-person shooter set in a huge DIY store.">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1c1a; --muted: #6b6860; --line: #e3e0d8;
    --accent: #e2711d; --accent-ink: #ffffff; --chip: #f1eee6;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151412; --panel: #1e1d1a; --ink: #ece9e2; --muted: #9c988e; --line: #2f2d29;
      --accent: #f08a3c; --accent-ink: #1a0f06; --chip: #2a2824;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 40px 20px 64px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 28px; }
  .brand { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
  .brand span { color: var(--accent); }
  .tagline { color: var(--muted); margin: 4px 0 0; }
  .status { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--chip); color: var(--ink); font-size: 14px; font-weight: 600; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #3fa34d; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .card + .card { margin-top: 16px; }
  .card-head { padding: 20px 24px 8px; }
  .card-head h2 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; color: var(--muted); font-size: 14px; }
  .pill { padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  .pill.latest { background: var(--accent); color: var(--accent-ink); }
  .pill.pre { background: var(--chip); color: var(--muted); }
  .pill.tag { background: var(--chip); color: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: none; letter-spacing: 0; }
  video { display: block; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; }
  .video-wrap { padding: 12px 24px 0; }
  .video-wrap video { border-radius: 10px; }
  .video-links { font-size: 14px; color: var(--muted); margin: 8px 0 0; }
  .notes { padding: 8px 24px 20px; }
  .notes h2 { font-size: 18px; margin: 24px 0 8px; }
  .notes h3 { font-size: 16px; margin: 20px 0 6px; }
  .notes ul { padding-left: 22px; }
  .notes li { margin: 4px 0; }
  .notes code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; background: var(--chip); padding: 1px 5px; border-radius: 4px; }
  .notes pre { overflow-x: auto; background: var(--chip); padding: 12px; border-radius: 8px; }
  .notes pre code { background: none; padding: 0; }
  .notes table { border-collapse: collapse; display: block; overflow-x: auto; }
  .notes th, .notes td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  a { color: var(--accent); }
  details.card summary { cursor: pointer; list-style: none; padding: 16px 24px; }
  details.card summary::-webkit-details-marker { display: none; }
  details.card summary h3 { display: inline; margin: 0; font-size: 17px; }
  details[open] summary { border-bottom: 1px solid var(--line); }
  .section-title { margin: 36px 0 12px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .empty, .error { color: var(--muted); padding: 24px; }
  footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 class="brand">Tacks<span>.</span></h1>
      <p class="tagline">A cartoony first-person shooter in a huge home improvement store. Spawn empty-handed, arm yourself from the shelves.</p>
    </div>
    <div class="status" id="status" hidden><span class="dot"></span><span id="status-text"></span></div>
  </header>

  <main id="latest"><div class="card"><p class="empty">Loading the latest release…</p></div></main>

  <section id="earlier-section" hidden>
    <h2 class="section-title">Earlier releases</h2>
    <div id="earlier"></div>
  </section>

  <footer id="footer">Updated automatically whenever a release is published.</footer>
</div>

<script>
  const fmtDate = iso => new Date(iso).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });

  function renderNotes(markdown) {
    const box = document.createElement("div");
    box.className = "notes";
    if (window.marked) {
      box.innerHTML = window.marked.parse(markdown || "", { gfm: true });
      box.querySelectorAll("a[href]").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
    } else {
      const pre = document.createElement("pre");
      pre.textContent = markdown || "";
      box.appendChild(pre);
    }
    return box;
  }

  function renderVideos(release) {
    const frag = document.createDocumentFragment();
    for (const src of release.videos) {
      const wrap = document.createElement("div");
      wrap.className = "video-wrap";
      const video = document.createElement("video");
      video.controls = true;
      video.preload = "metadata";
      video.playsInline = true;
      video.src = src;
      wrap.appendChild(video);
      const link = document.createElement("p");
      link.className = "video-links";
      link.innerHTML = `Gameplay video · <a href="${src}" download>download MP4</a>`;
      wrap.appendChild(link);
      frag.appendChild(wrap);
    }
    return frag;
  }

  function head(release, tag = "div") {
    const el = document.createElement(tag);
    el.className = "card-head";
    const pills = [
      release.latest ? '<span class="pill latest">Latest</span>' : "",
      release.prerelease ? '<span class="pill pre">Pre-release</span>' : "",
      `<span class="pill tag">${release.tag}</span>`,
    ].join("");
    el.innerHTML = `<h2></h2><div class="meta">${pills}<span>Released ${fmtDate(release.published)}</span></div>`;
    el.querySelector("h2").textContent = release.name;
    return el;
  }

  async function main() {
    const latestBox = document.getElementById("latest");
    let data;
    try {
      const res = await fetch("releases.json", { cache: "no-store" });
      data = await res.json();
    } catch (e) {
      latestBox.innerHTML = '<div class="card"><p class="error">Could not load release data.</p></div>';
      return;
    }
    const releases = data.releases || [];
    if (!releases.length) {
      latestBox.innerHTML = '<div class="card"><p class="empty">No release has been published yet.</p></div>';
      return;
    }
    const current = releases.find(r => r.latest) || releases[0];
    document.getElementById("status").hidden = false;
    document.getElementById("status-text").textContent = `Current release: ${current.tag}`;
    document.title = `Tacks ${current.tag}`;

    const card = document.createElement("article");
    card.className = "card";
    card.appendChild(head(current));
    card.appendChild(renderVideos(current));
    card.appendChild(renderNotes(current.notes));
    latestBox.replaceChildren(card);

    const others = releases.filter(r => r !== current);
    if (others.length) {
      document.getElementById("earlier-section").hidden = false;
      const list = document.getElementById("earlier");
      for (const r of others) {
        const d = document.createElement("details");
        d.className = "card";
        const s = document.createElement("summary");
        const h = document.createElement("h3");
        h.textContent = `${r.name} `;
        s.appendChild(h);
        const meta = document.createElement("span");
        meta.className = "meta";
        meta.style.display = "inline";
        meta.textContent = ` · ${r.tag} · ${fmtDate(r.published)}`;
        s.appendChild(meta);
        d.appendChild(s);
        d.appendChild(renderVideos(r));
        d.appendChild(renderNotes(r.notes));
        list.appendChild(d);
      }
    }
  }

  window.addEventListener("DOMContentLoaded", main);
</script>
</body>
</html>
